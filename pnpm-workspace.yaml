packages:
  - packages/*

autoInstallPeers: false
strictPeerDependencies: true
savePrefix: ''
nodeVersion: 26.13.0
engineStrict: true

# `@angular/build` lists this binding as optional, and the binding pins `@emnapi/core` and
# `@emnapi/runtime` to a prerelease its own `@napi-rs/wasm-runtime` does not accept as a peer, so a
# strict install refuses it. It is the parser for WebAssembly hosts, and no host this repository
# builds or tests on is one, so it is left out rather than strict peer checking loosened.
ignoredOptionalDependencies:
  - '@oxc-parser/binding-wasm32-wasi'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  # The linter's module resolver. Its install script is `napi-postinstall`, which exists to
  # fetch a native binding when the platform-specific optional dependency did not resolve. The
  # lockfile carries all twenty-two of them, the right one installs on its own, and the lint
  # self-test fails if module resolution is not working, so nothing here needs to run a script
  # from a package to work.
  unrs-resolver: false
